# Local control-plane database. Port 5433 avoids clashing with other local Postgres instances.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rehearsal
      POSTGRES_PASSWORD: rehearsal
      POSTGRES_DB: rehearsal
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rehearsal-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearsal"]
      interval: 2s
      retries: 30
volumes:
  rehearsal-pg:
