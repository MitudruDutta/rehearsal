# Third-party applications Rehearsal compiles into worlds. None were written by
# the Rehearsal authors. Each entry pins the source commit inspected by the
# compiler and the published images the runner executes.
#
# split: development applications may inform compiler development;
#        holdout applications must not be inspected while developing the
#        compiler. They measure whether compilation transfers.
#
# Licences travel with any exported world bundle that contains these images.

applications:
  - name: gitea
    split: development
    domain: code collaboration / issue tracking
    license: MIT
    source:
      kind: git
      url: https://github.com/go-gitea/gitea
      ref: v28.1.0
      commit: 4ebd5e319b6a9e629bfd7a04292a6fe85b08dee9
    images:
      gitea: gitea/gitea:28.1.0@sha256:f505a0d3a41323b786e05942fc7a4075e07ae7c169fd9485649aa55ee543a21a

  - name: chatwoot
    split: development
    domain: customer support desk
    license: MIT (enterprise/ directory under a separate licence; not used)
    source:
      kind: git
      url: https://github.com/chatwoot/chatwoot
      ref: v4.18.0
      commit: 9f920b549c14491a4e587687a3eed5d21c6ccc7d
    images:
      chatwoot: chatwoot/chatwoot:v4.18.0@sha256:b419dded7e9d2f54a24fd427b74ba7e6069d601b500618045c1eb6c01a1cc9a1
      # Chatwoot's own compose files use pgvector (its schema enables the "vector" extension).
      postgres: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
      redis: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499

