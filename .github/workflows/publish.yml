name: Build and publish packages (PyPI and npm)

# Publishing happens only from a published GitHub Release whose tag is v<version from rehearsal/py/pyproject.toml>. Before any
# upload, every gate below must pass on that exact commit:
#   1. the whole test suite (tests.yml: unit, integration against PostgreSQL, console build, plugin drift)
#   2. the version: matches the tag, is valid, is higher than every version on PyPI, has a changelog entry,
#      the agent plugin carries the same version, and the commit is on main
#   3. the distributions: built, metadata strict-checked, required resources present, installable with client
#      dependencies only on every supported Python, and the installed MCP server answers over stdio
#   4. the npm package (rehearsal/ts): same version, built, tested, packed, and its installed CLI and MCP server run
# After the upload, the published package is installed from PyPI and must report the new version.
# A manual run (workflow_dispatch) runs every gate and builds, but never uploads.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  version:
    name: Version gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the version against the tag, PyPI, the changelog, and the plugin
        run: |
          python -m pip install --quiet "packaging>=24"
          python .github/scripts/check-release.py --version-only
      - name: Release commit is on main
        if: github.event_name == 'release'
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release ${RELEASE_TAG} points at ${GITHUB_SHA}, which is not on main. Merge first, then release from main."
            exit 1
          }

  build:
    name: Build and verify distributions
    needs: [tests, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install build tools
        run: |
          npm install --global pnpm@10.33.0
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=6" "packaging>=24"
      - name: Build bundled console
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Build distributions and check metadata and contents
        run: |
          python -m build rehearsal/py
          python -m twine check --strict rehearsal/py/dist/*
          python .github/scripts/check-release.py
      - name: Installed MCP server answers over stdio
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv mcp-smoke
          mcp-smoke/bin/python -m pip install --quiet "$(ls "$GITHUB_WORKSPACE"/rehearsal/py/dist/*.whl)[mcp]"
          mcp-smoke/bin/python -m pip check
          mcp-smoke/bin/python "$GITHUB_WORKSPACE/.github/scripts/smoke-mcp.py" "$PWD/mcp-smoke/bin/rehearsal"
      - name: Save verified distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: |
            rehearsal/py/dist/*.whl
            rehearsal/py/dist/*.tar.gz
          if-no-files-found: error

  client-install:
    name: Client install on Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]  # every version rehearsal/py/pyproject.toml advertises
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist/
      - name: Install the wheel with client dependencies only
        run: |
          python -m venv sdk-smoke
          sdk-smoke/bin/python -m pip install dist/*.whl
          sdk-smoke/bin/python -m pip check
          sdk-smoke/bin/rehearsal --version
          sdk-smoke/bin/rehearsal --help > /dev/null
          sdk-smoke/bin/rehearsal login --help > /dev/null
          sdk-smoke/bin/rehearsal skill print > /dev/null
          sdk-smoke/bin/python -c 'from rehearsal.sdk import Rehearsal; import importlib.util; assert importlib.util.find_spec("fastapi") is None'
      - name: Install the source archive
        run: |
          python -m venv sdist-smoke
          sdist-smoke/bin/python -m pip install dist/*.tar.gz
          sdist-smoke/bin/rehearsal --version

  npm-build:
    name: Build and verify the npm package
    needs: [tests, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build, test and pack
        run: |
          npm install --global pnpm@10.33.0
          pnpm --dir rehearsal/ts install --frozen-lockfile
          pnpm --dir rehearsal/ts test
          mkdir -p npm-dist && cd rehearsal/ts && npm pack --pack-destination ../../npm-dist
      - name: Installed package runs (CLI, SDK and MCP server)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir npm-smoke && cd npm-smoke && npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/npm-dist/rehearsal-kit-*.tgz
          version="$(node -p 'require("rehearsal-kit/package.json").version')"
          test "$(npx rehearsal --version)" = "rehearsal-kit ${version}"
          npx rehearsal --help > /dev/null
          npx rehearsal skill print > /dev/null
          node --input-type=module -e 'const m = await import("rehearsal-kit"); const s = await import("rehearsal-kit/mcp"); if (!m.Rehearsal || !s.buildServer) process.exit(1)'
      - name: The publish command accepts the package (dry run)
        run: npm publish ./npm-dist/*.tgz --access public --dry-run
      - name: Save the verified package
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: npm-dist/*.tgz
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: [tests, version, npm-build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/rehearsal-kit
    permissions:
      id-token: write  # npm trusted publishing, with provenance
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: npm-dist/
      # The ./ matters: npm reads "npm-dist/<file>.tgz" as a GitHub repository (owner/name) and tries to clone it
      - name: Publish using npm trusted publishing
        run: npm publish ./npm-dist/*.tgz --access public --provenance

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [tests, version, build, client-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/rehearsal-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-published:
    name: Install the published release from PyPI
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wait for PyPI, install, and check the version
        run: |
          version="${RELEASE_TAG#v}"
          python -m venv published
          for attempt in $(seq 1 20); do
            if published/bin/python -m pip install --quiet --no-cache-dir "rehearsal-kit[mcp]==${version}"; then break; fi
            echo "PyPI does not serve ${version} yet (attempt ${attempt}); waiting 30 s"; sleep 30
          done
          test "$(published/bin/rehearsal --version)" = "rehearsal-kit ${version}"
          published/bin/python -m pip check
