[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rehearsal-kit"
version = "0.1.0"
description = "Rehearse AI agents on a sandboxed copy of your own application before they reach production."
readme = "docs/PACKAGE.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai-agents", "agent-evaluation", "testing", "sandbox", "llm", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# The client (SDK + CLI talking to a Rehearsal server) needs only these.
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Running the control plane, workers, and sandboxes yourself.
server = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.7",
  "sqlalchemy>=2.0.20",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "itsdangerous>=2.1",
  "openai>=1.40",
  "python-multipart>=0.0.9",
  "pyjwt[crypto]>=2.10",
]
telemetry = ["neatlogs[openai]>=1.4.25; python_version < '3.14'"]  # neatlogs supports Python < 3.14 only; tracing turns itself off without it
training = ["openenv-core>=0.2", "kaggle>=1.7"]
mcp = ["mcp>=1.9"]  # `rehearsal mcp`: lets an AI assistant use Rehearsal with your API key
all = ["rehearsal-kit[server,telemetry]"]
dev = ["rehearsal-kit[server]", "pytest>=8", "pytest-asyncio>=0.23", "build>=1.2", "twine>=6"]

[project.scripts]
rehearsal = "rehearsal.sdk.cli:main"

[tool.setuptools.packages.find]
include = ["rehearsal*"]

[tool.setuptools.package-data]
rehearsal = ["py.typed", "db/migrations/*.py", "db/migrations/versions/*.py", "db/alembic.ini", "providers/Dockerfile", "training/kaggle_kernel/*", "api/static/**/*", "assets/*.yaml", "assets/skill/*.md", "assets/skill/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
